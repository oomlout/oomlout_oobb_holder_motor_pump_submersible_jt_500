    physical_status: Physical pump fit, printed strength and slicing have not been
      verified.
    preparation:
    - 'Print the single 3dpr.stl once: it contains the base, clamp and top cover,
      separated by 10 mm on the bed. Keep all three pieces separate. The assembly.scad
      file shows their fitted positions.'
    - 'Keep the supplied STL orientations: base plate face on the bed with feet upward;
      clamp on its open side with the pump axis horizontal. Inspect the slicer preview
      before printing.'
    - Clear the nut slots, screw bores and water openings. Test that each M3 nut slides
      fully into its pocket.
    - Use four M3 x 16 mm countersunk screws for the base and two M3 x 16 mm countersunk
      screws for the cover. Both lengths include the head; the linked hex-socket screws
      use a 2 mm hex key.
    - Leave the hose disconnected. Route the free cable end through both clamp and
      cover before fitting them; check that any fitted connector clears the circular
      openings. Use either roof opening for the outlet and the other for the cable.
    steps:
    - action: Place the base on its four feet, retaining tongues facing upward and
        the four screw countersinks facing downward.
      add:
      - base
      key: step_01
      move: {}
      title: Place the base
    - action: Choose which side you want the outlet on. Lower the pump onto the two
        ledges with its outlet and cable up. Check from underneath that the fins enter
        the windows and all three inlet openings are clear.
      add:
      - pump
      key: step_02
      move:
        pump:
        - 0
        - 0
        - 16
      title: Seat the pump
    - action: Slide two M3 nuts into each side of the clamp. Pass the cable through
        its top opening and lower the clamp over the pump, guiding the outlet through
        the other opening. Seat both nut tabs against the base.
      add:
      - top
      - nut_1
      - nut_2
      - nut_3
      - nut_4
      key: step_03
      move:
        nut_1:
        - -12
        - 0
        - 28
        nut_2:
        - -12
        - 0
        - 28
        nut_3:
        - 12
        - 0
        - 28
        nut_4:
        - 12
        - 0
        - 28
        top:
        - 0
        - 0
        - 28
      title: Load the nuts and fit the clamp
    - action: Hold the pump and clamp seated while accessing the underside. Insert
        all four M3 x 16 mm countersunk screws upward into the captive nuts. Start
        each screw before tightening them evenly until the heads seat; stop when the
        pump is captured without distorting the printed parts.
      add:
      - screw_1
