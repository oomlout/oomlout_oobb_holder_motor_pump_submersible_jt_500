  physical_status: Physical pump fit, printed strength and slicing have not been verified.
  preparation:
  - 'Print the single 3dpr.stl once: it contains the base, clamp and top cover, separated
    by 10 mm on the bed. Keep all three pieces separate. The assembly.scad file shows
    their fitted positions.'
  - 'Keep the supplied STL orientations: base plate face on the bed with feet upward;
    clamp on its open side with the pump axis horizontal. Inspect the slicer preview
    before printing.'
  - Clear the nut slots, screw bores and water openings. Test that each M3 nut slides
    fully into its pocket.
  - Use four M3 x 16 mm countersunk screws for the base and two M3 x 16 mm countersunk
    screws for the cover. Both lengths include the head; the linked hex-socket screws
    use a 2 mm hex key.
  - Leave the hose disconnected. Route the free cable end through both clamp and cover
    before fitting them; check that any fitted connector clears the circular openings.
    Use either roof opening for the outlet and the other for the cable.
