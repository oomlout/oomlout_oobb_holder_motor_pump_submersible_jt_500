          installation:
          - Check that the pump rear face rests on both retaining tongues and that
            the fins pass into the water openings.
          - Confirm that the top plate captures the pump, all nuts are seated, and
            the cable and outlet are free of pinching.
          - Use the exposed OOBB holes to attach the base to your structure. Choose
            those attachment fasteners for the mating structure; they are not included
            in the holder hardware count.
          - Keep the underside water openings clear when mounting the holder.
          - The cover presents six accessible M6 captive attachment nuts. Keep M6
            screw projection below the cover face to at most 8 mm; the holes pass
            through the roof, so check that projecting bolts clear the pump. Attachment
            screws are not included in the inventory.
