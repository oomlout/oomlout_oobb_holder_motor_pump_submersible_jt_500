    book:
      cover_subtitle: 5 x 5 OOBB base / M3 x 16 mm screws
      cover_title: JT-500 pump holder
      details:
      - 'Base: 5 x 5 OOBB units, 74 x 74 mm; 6 mm plate and 2.7 mm corner feet; 3
        mm clearance below the fin tips.'
      - 'Clamp: 3 x 3 OOBB units, 44 x 44 mm above the local nut tabs.'
      - 'Pump reference body: 33.43 x 38.33 x 79 mm; rear projections 5.7 mm.'
      - Rear retaining tongues and the top plate capture the pump axially.
      - 'Fasteners: four M3 x 16 mm countersunk screws driven upward; four side-loaded
        M3 nuts.'
      - 'Top cover: two M3 x 16 mm countersunk screws; six M6 attachment nuts plus
        two M3 fixing nuts.'
      - 'Top openings: 15.5 mm for the outlet and cable; route the free cable end
        before lowering the clamp.'
      - 'One print file: base face down, clamp on its open side, cover flat with countersinks
        upward.'
      - Either pump orientation fits. Two 4 mm wide tongues support the rear housing
        between the inlet openings.
      - 'Regenerate CAD, renders and instructions: python action_make_holder.py'
      - See Assembly in the part README for the numbered steps and fit checks.
      - AI-generated CAD images and instructions. Errors possible. Physical fit and
        slicing unverified.
