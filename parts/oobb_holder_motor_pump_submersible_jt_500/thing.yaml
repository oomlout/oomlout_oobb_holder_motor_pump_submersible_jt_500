    title: Load the nuts and fit the clamp
  - action: Hold the pump and clamp seated while accessing the underside. Insert all
      four M3 x 16 mm countersunk screws upward into the captive nuts. Start each
      screw before tightening them evenly until the heads seat; stop when the pump
      is captured without distorting the printed parts.
    add:
    - screw_1
