          part_notes:
            base: Print one black base, plate face down and four feet up. The two
              inward tongues support the rear housing. The centre relief and upper/lower
              windows clear the rear projections and admit water. OOBB holes beneath
              the clamp and nut tabs are omitted. The two M6 corner holes at the flush
              edge pass through the plate and feet. Curved notches in the clamp give
              each hole 15 mm diameter clearance. Four countersinks on the underside
              take the M3 x 16 mm clamp screws.
            lid: Print the black nut cover flat, with countersinks upward. It traps
              six M6 attachment nuts in the upper roof pockets. Two M3 fixing nuts
              slide into lower side slots beneath solid shoulders. Two M3 x 16 mm
              countersunk screws secure it between the M6 rows within the plate. All
              top openings are circular.
            top: Print one teal clamp on the open side in the supplied orientation.
              The two walls connect the top plate to the local nut tabs. Slide four
              M3 nuts in from the outside edges. Route the outlet and cable through
              the two 15.5 mm openings before seating the clamp on the base.
